name: publish nuget packeage
on:
  workflow_dispatch:

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - run: dotnet pack --configuration Release
    - uses: actions/upload-artifact@v4
      with:
        name: package.nupkg
        if-no-files-found: error
        retention-days: 3
        path: bin/Release/*.nupkg

  deploy:
    needs: create_nuget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
      - uses: actions/download-artifact@v4
        id: path
        with:
          name: package.nupkg

      - name: Get OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NuGet package
        run: |
            dotnet nuget push "${{ steps.path.outputs.download-path }}/*.nupkg" --api-key ${{ steps.oidc.outputs.token }} --source https://api.nuget.org/v3/index.json --skip-duplicate
